name: Run Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installer platform detection
        run: sh scripts/test-get-cli.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - docker-build
          - go-build-release-darwin-amd64
          - go-build-release-darwin-arm64
          - go-build-release-linux-amd64
          - go-build-release-linux-arm32-v6
          - go-build-release-linux-arm32-v7
          - go-build-release-linux-riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26

      - name: Build targets via `make`
        run: make ${{ matrix.target }}
